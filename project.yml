name: MuscleLoadApp
options:
  bundleIdPrefix: com.muscleload
  deploymentTarget:
    iOS: "17.0"
packages:
  MuscleLoadCore:
    path: MuscleLoadCore
targets:
  MuscleLoadApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MuscleLoadApp/App
      - path: MuscleLoadApp/Navigation
      - path: MuscleLoadApp/Persistence
    dependencies:
      - package: MuscleLoadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muscleload.app
        PRODUCT_NAME: MuscleLoadApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MuscleLoad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
  MuscleLoadAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MuscleLoadAppTests
    dependencies:
      - target: MuscleLoadApp
    settings:
      base:
        SWIFT_VERSION: "5.10"
schemes:
  MuscleLoadApp:
    build:
      targets:
        MuscleLoadApp: all
        MuscleLoadAppTests: [test]
    test:
      targets:
        - MuscleLoadAppTests
