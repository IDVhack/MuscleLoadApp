name: MuscleLoadApp CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select simulator destination
        id: destination
        run: |
          set -eo pipefail
          xcrun simctl list devices available -j > /tmp/devices.json
          echo "Available simulators:"
          xcrun simctl list devices available
          DEVICE_NAME=$(jq -r '
            .devices | to_entries[]
            | select(.key | contains("iOS"))
            | .value[]
            | select(.isAvailable and (.name | startswith("iPhone")))
            | .name
          ' /tmp/devices.json | sort -V | tail -n1)
          if [ -z "$DEVICE_NAME" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Selected simulator: $DEVICE_NAME"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
      - name: Run MuscleLoadApp tests
        run: |
          xcodebuild test \
            -project MuscleLoadApp.xcodeproj \
            -scheme MuscleLoadApp \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
