<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта мышц</title>
<style>
  :root {
    --bg: #f4f2fb; --card-bg: #ffffff; --text: #1c1b29; --text-muted: #6b6880;
    --status-early: #e0524a; --status-soon: #e8b23d; --status-ready: #4caf82;
    --neutral: #e3c9a8; --outline: #2a1c12; --seam: #2a1c12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17151f; --card-bg: #221f2e; --text: #ede9f7; --text-muted: #9691ad;
      --neutral: #6b5138; --outline: #120b07; --seam: #120b07;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17151f; --card-bg: #221f2e; --text: #ede9f7; --text-muted: #9691ad;
    --neutral: #6b5138; --outline: #120b07; --seam: #120b07;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; text-align: center; }
  p.hint { color: var(--text-muted); font-size: 12px; margin: 0 0 18px; text-align: center; max-width: 440px; }
  .card { background: var(--card-bg); border-radius: 20px; padding: 18px 10px 14px; max-width: 480px; width: 100%; }
  .figures { display: flex; justify-content: center; gap: 4px; }
  .figure-block { text-align: center; }
  .figure-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .legend { display: flex; justify-content: center; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .controls { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 13px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--outline); background: var(--card-bg); color: var(--text); cursor: pointer;
  }
  button:hover { opacity: 0.85; }
  .region { transition: fill 0.25s ease; }
  .silhouette { fill: none; stroke: var(--outline); stroke-width: 2; stroke-linejoin: round; }
  .seamline { fill: none; stroke: var(--seam); stroke-width: 0.8; opacity: 0.5; }
  .neutral-part { fill: var(--neutral); stroke: var(--outline); stroke-width: 1.5; }
</style>
</head>

      shoulders: ['f-shoulders-l', 'f-shoulders-r', 'b-shoulders-l', 'b-shoulders-r'],
      biceps: ['f-biceps-l', 'f-biceps-r'],
      triceps: ['b-triceps-l', 'b-triceps-r'],
      chest: ['f-chest'],
      upperBack: ['b-upperback'],
      lowerBack: ['b-lowerback-l', 'b-lowerback-r', 'b-sacrum'],
      absCore: ['f-abs'],
      glutes: ['b-glutes-l', 'b-glutes-r'],
      quadriceps: ['f-quads-l', 'f-quads-r'],
      hamstrings: ['b-hamstrings-l', 'b-hamstrings-r'],
      adductors: ['f-adductors'],
      calves: ['f-calves-l', 'f-calves-r', 'b-calves-l', 'b-calves-r'],
      forearms: ['f-forearms-l', 'f-forearms-r', 'b-forearms-l', 'b-forearms-r']
    };
    const statusColor = { early: 'var(--status-early)', soon: 'var(--status-soon)', ready: 'var(--status-ready)' };
    function paint(statusMap) {
      for (const muscle in regionIds) {
        const color = statusColor[statusMap[muscle] || 'ready'];
        regionIds[muscle].forEach(id => { const el = document.getElementById(id); if (el) el.style.fill = color; });
      }
    }
    const presets = {
      afterLegDay: { quadriceps:'early', glutes:'early', hamstrings:'early', adductors:'soon', calves:'soon', lowerBack:'soon', chest:'ready', shoulders:'ready', biceps:'ready', triceps:'ready', upperBack:'ready', absCore:'ready', forearms:'ready' },
      afterPush: { chest:'early', shoulders:'early', triceps:'soon', absCore:'soon', biceps:'ready', upperBack:'ready', lowerBack:'ready', glutes:'ready', quadriceps:'ready', hamstrings:'ready', adductors:'ready', calves:'ready', forearms:'ready' },
      allReady: { shoulders:'ready', biceps:'ready', triceps:'ready', chest:'ready', upperBack:'ready', lowerBack:'ready', absCore:'ready', glutes:'ready', quadriceps:'ready', hamstrings:'ready', adductors:'ready', calves:'ready', forearms:'ready' },
      mixed: { shoulders:'soon', biceps:'ready', triceps:'early', chest:'early', upperBack:'soon', lowerBack:'ready', absCore:'ready', glutes:'early', quadriceps:'soon', hamstrings:'early', adductors:'ready', calves:'ready', forearms:'soon' }
    };
    function applyPreset(name) { paint(presets[name]); }
    applyPreset('mixed');
  </script>
